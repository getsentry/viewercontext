# Warden Configuration
# https://github.com/getsentry/warden
#
# Org-wide CI runs Warden via getsentry/.github; this adds repo skills on top.

version = 1

[defaults]
failOn = "high"
reportOn = "medium"

[[skills]]
name = "wrdn-authz"
remote = "getsentry/warden-skills"
paths = ["sentry_viewercontext/**/*.py", "rust/src/**/*.rs"]

[[skills.triggers]]
type = "pull_request"
actions = ["opened", "synchronize", "reopened"]

[[skills]]
name = "find-bugs"
remote = "getsentry/skills"
paths = ["sentry_viewercontext/**/*.py", "rust/src/**/*.rs", "scripts/**/*.py"]

[[skills.triggers]]
type = "pull_request"
actions = ["opened", "synchronize", "reopened"]

[[skills]]
name = "wrdn-gha-workflows"
remote = "getsentry/warden-skills"
paths = [".github/workflows/**/*.yml"]

[[skills.triggers]]
type = "pull_request"
actions = ["opened", "synchronize", "reopened"]
