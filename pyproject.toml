[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sentry-viewercontext"
version = "0.2.0"
description = "Caller identity propagated between Sentry services"
readme = "README.md"
license = "FSL-1.1-ALv2"
license-files = ["LICENSE.md"]
authors = [{ name = "Sentry", email = "oss@sentry.io" }]
requires-python = ">=3.13"
dependencies = ["PyJWT>=2.13.0"]

[project.urls]
Repository = "https://github.com/getsentry/viewercontext"

[tool.setuptools]
packages = ["sentry_viewercontext"]

[tool.setuptools.package-data]
sentry_viewercontext = ["py.typed"]

[dependency-groups]
dev = ["pytest>=9.0.3", "pytest-cov>=4.0.0", "mypy>=2.1.0", "ruff>=0.14.0"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["sentry_viewercontext", "tests", "scripts"]
warn_unreachable = true
enable_error_code = [
    "deprecated",
    "explicit-override",
    "ignore-without-code",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unused-awaitable",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # isort
    "UP",           # pyupgrade
    "B",            # bugbear
    "LOG", "G",     # logging
    "S",            # bandit
    "C4",           # comprehensions
    "SIM",          # simplify
    "PIE",
    "RET",
    "PT",           # pytest style
    "PL",           # pylint
    "TID",          # tidy imports
    "T20",          # no print
    "ERA",          # commented-out code
    "RUF",
    "N",            # naming
    "A",            # builtin shadowing
    "DTZ",          # naive datetimes
    "BLE",          # blind except
    "FBT",          # boolean positional args
    "TRY",
    "PERF",
]

ignore = [
    "TRY003",  # messages on stdlib exceptions are fine
    "TRY004",  # deserialize() raises ValueError for any bad payload, type errors included
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "PLR2004"]
"scripts/**" = ["S105"]

[tool.coverage.run]
branch = true
source = ["sentry_viewercontext"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-p", "no:cacheprovider"]
xfail_strict = true
# Fixture keys are short on purpose; the HS512 wrong-algorithm case trips this.
filterwarnings = ["error", "ignore::jwt.warnings.InsecureKeyLengthWarning"]
