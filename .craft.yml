minVersion: 3.9.0
changelog:
  filePath: CHANGELOG.md
  policy: auto
preReleaseCommand: bash scripts/bump-version.sh
github:
  owner: getsentry
  repo: viewercontext
artifactProvider:
  name: github
requireNames:
  - /^sentry_viewercontext-.*-py3-none-any\.whl$/
  - /^sentry_viewercontext-.*\.tar\.gz$/
targets:
  - name: github
  - name: pypi
  - name: sentry-pypi
    internalPypiRepo: getsentry/pypi
  - name: crates
