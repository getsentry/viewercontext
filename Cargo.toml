[package]
name = "sentry-viewercontext"
version = "0.1.0"
authors = ["Sentry <oss@sentry.io>"]
description = "Caller identity propagated between Sentry services"
repository = "https://github.com/getsentry/viewercontext"
license-file = "LICENSE.md"
edition = "2024"
include = ["/rust/src/**", "/Cargo.toml", "/README.md", "/LICENSE.md"]

[lib]
path = "rust/src/lib.rs"

[dependencies]
jsonwebtoken = { version = "11.1", default-features = false, features = ["rust_crypto"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"

[[test]]
name = "conformance"
path = "rust/tests/conformance.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
str_to_string = "warn"
