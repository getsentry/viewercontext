[package]
name = "sentry-viewercontext"
version = "0.1.0"
authors = ["Sentry <oss@sentry.io>"]
description = "Caller identity propagated between Sentry services"
repository = "https://github.com/getsentry/viewercontext"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.88"
include = ["/rust/src/**", "/Cargo.toml", "/README.md", "/LICENSE"]

[lib]
name = "viewercontext"
path = "rust/src/lib.rs"

[dependencies]
jsonwebtoken = { version = "11.1", default-features = false, features = ["rust_crypto"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"

[[test]]
name = "conformance"
path = "rust/tests/conformance.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
